[package]
name = "extol_sprite_layer"
version = "0.5.0"
edition = "2021"
authors = ["Ash <ext0l@catgirl.ai>"]
categories = [ "game-development" ]
description = "Explicitly-defined sprite layers for Bevy, including automatic y-sorting."
keywords = [ "gamedev", "bevy" ]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/MoonBark-Studio/extol_sprite_layer"
exclude = [ "docs/*" ]

[dependencies]
bevy = { workspace = true }
ordered-float = "4.2.0"
tap = "1.0.1"

[dev-dependencies]
bevy = { workspace = true }
criterion = "0.5.0"
fastrand = "1.9.0"

[[bench]]
name = "benchmark"
harness = false
